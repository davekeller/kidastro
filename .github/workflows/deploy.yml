name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [themes-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # kidastro-themes is served at kidastro.com/themes — build it from its
      # own repo (Vite base is already /themes/) and add it to the site.
      - name: Checkout kidastro-themes
        uses: actions/checkout@v4
        with:
          repository: davekeller/kidastro-themes
          path: themes-src

      - name: Build kidastro-themes
        working-directory: themes-src
        run: |
          npm ci
          npm run build

      - name: Add themes to site output
        run: |
          mkdir -p out/themes
          cp -R themes-src/dist/. out/themes/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
